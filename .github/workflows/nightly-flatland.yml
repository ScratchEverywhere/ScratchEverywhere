name: Flatland Nightly Build

on:
  push:
    paths:
      - CMakeLists.txt
      - cmake/renderers/flatland.cmake
      - cmake/windowing/flatland.cmake
      - cmake/audio/flatland.cmake
      - cmake/platforms/pc.cmake
      - cmake/deps/*
      - source/runtime/**
      - source/renderers/flatland/**
      - source/windowing/flatland/**
      - source/audio/flatland/**
      - source/*
      - include/**
      - .github/workflows/nightly-flatland.yml
      - docker/Dockerfile.flatland
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  flatland:
    name: Flatland Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Export
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.flatland
          target: exporter
          outputs: type=local,dest=.

      - name: Upload Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Scratch Everywhere! Flatland Linux Nightly
          path: scratch-pc
