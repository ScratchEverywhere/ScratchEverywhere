name: Ubuntu Touch Nightly Build

on:
  push:
    paths:
      - CMakeLists.txt
      - cmake/platforms/pc.cmake
      - cmake/renderers/sdl2.cmake
      - cmake/renderers/sdl3.cmake
      - cmake/windowing/sdl2.cmake
      - cmake/windowing/sdl3.cmake
      - cmake/audio/sdl2.cmake
      - cmake/audio/sdl3.cmake
      - cmake/deps/*
      - clickable.yaml
      - clickable-16.04.yaml
      - source/runtime/**
      - source/platforms/
      - source/platforms/pc/**
      - source/renderers/sdl2/**
      - source/renderers/sdl3/**
      - source/windowing/sdl2/**
      - source/windowing/sdl3/**
      - source/audio/sdl2/**
      - source/audio/sdl3/**
      - source/*
      - source/menus/**
      - gfx/ut/**
      - gfx/menu/**
      - gfx/ingame/**
      - gfx/translations/**
      - include/**
      - .github/workflows/nightly-ut.yml
      - docker/Dockerfile.ut
      - docker/Dockerfile.ut1604
      - source/main.cpp
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Ubuntu Touch ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 24.04 arm64
            dockerfile: docker/Dockerfile.ut
            artifact: Scratch Everywhere! Ubuntu Touch 24.04 Nightly
            file: scratch-ut-24.04-arm64.click
          - name: 16.04 armhf
            dockerfile: docker/Dockerfile.ut1604
            artifact: Scratch Everywhere! Ubuntu Touch 16.04 Nightly
            file: scratch-ut-16.04-armhf.click
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Export
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: exporter
          outputs: type=local,dest=.

      - name: Upload Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
