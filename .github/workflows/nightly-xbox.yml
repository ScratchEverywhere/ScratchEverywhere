name: Original Xbox Nightly Build

on:
  push:
    paths:
      - CMakeLists.txt
      - cmake/platforms/xbox.cmake
      - cmake/renderers/sdl3.cmake
      - cmake/windowing/sdl3.cmake
      - cmake/audio/sdl3.cmake
      - cmake/deps/*
      - cmake/patches/*
      - source/runtime/**
      - source/renderers/sdl3/**
      - source/windowing/sdl3/**
      - source/*
      - source/platforms/
      - source/platforms/xbox/**
      - source/menus/**
      - source/audio/sdl3/**
      - gfx/menu/**
      - include/**
      - .github/workflows/nightly-xbox.yml
      - docker/Dockerfile.xbox
      - source/main.cpp
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Create `romfs` directory
        run: mkdir romfs
      - name: Build and Export
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.xbox
          target: exporter
          outputs: type=local,dest=.
      - name: Upload Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Scratch Everywhere! Original Xbox Nightly
          path: |
            SE.iso
            iso_root
