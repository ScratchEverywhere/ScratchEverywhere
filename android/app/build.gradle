plugins {
	id "com.android.application"
}

def targetAbis = ["arm64-v8a"]
if (project.hasProperty("ABIS")) {
	targetAbis = project.getProperty("ABIS").split(";")
}

android {
	namespace "io.github.scratcheverywhere"
	compileSdkVersion 36
	defaultConfig {
		minSdkVersion 18
		targetSdkVersion 36
		versionCode 4
		versionName "1.3"
		externalNativeBuild {
			cmake {
				arguments "-DANDROID_STL=c++_static", "-DBUILD_SHARED_LIBS=ON",
					"-DCL_CACHE_DIR=${buildDir}/.cl", "-DCL_STAGES=source"
				abiFilters = targetAbis
			}
		}
	}
	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
	}
	applicationVariants.all { variant ->
		tasks["merge${variant.name.capitalize()}Assets"]
			.dependsOn("externalNativeBuild${variant.name.capitalize()}")
		variant.outputs.all {
			outputFileName "scratch-android.apk"
		}
	}
	sourceSets.main {
		assets.srcDirs "../../romfs"
	}
	externalNativeBuild {
		cmake {
			path "../../CMakeLists.txt"
		}
	}
	lint {
		abortOnError = false
	}
}

dependencies {
	implementation fileTree(include: ['*.jar'], dir: 'libs')
}