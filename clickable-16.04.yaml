clickable_minimum_required: 8.0.0
framework: ubuntu-sdk-16.04.5
build_dir: ${ROOT}/build/ut/${ARCH_TRIPLET}
builder: cmake
build_args:
    - -B ${BUILD_DIR}
    - -S ${SRC_DIR}
    - -DCMAKE_C_COMPILER=clang-8
    - -DCMAKE_CXX_COMPILER=clang++-8
    - -DCMAKE_C_LINKER=clang-8
    - -DCMAKE_CXX_LINKER=clang++-8
    - -DCMAKE_C_FLAGS="--target=${ARCH_TRIPLET}"
    - -DCMAKE_CXX_FLAGS="--target=${ARCH_TRIPLET} -stdlib=libc++"
    - -DCMAKE_ASM_FLAGS="--target=${ARCH_TRIPLET}"
    - -DCMAKE_BUILD_RPATH='$ORIGIN/lib'
    - -DCMAKE_INSTALL_RPATH='$ORIGIN/lib'
    - -DCMAKE_BUILD_TYPE=Debug
    - -DSE_CLOUDVARS=OFF
    - -DSE_DOWNLOAD=OFF
    - -DSE_JIT=OFF # clang 8 is too unc for the available jit implementations
    - -DUBUNTU_TOUCH=ON
    - -DUBUNTU_TOUCH_1604=ON
    - -DSE_CUSTOM_EXTENSIONS=OFF
    - -DSE_CMAKERC=OFF
    - -DSE_DECTALK=OFF
    - -DSE_RENDERER=sdl2
    - -DSE_WINDOWING=sdl2
make_args:
    - -Wno-deprecated-declarations
#    - VERBOSE=1
#make_jobs: 1
image_setup:
    run:
        - apt remove cmake -y
        - wget https://cmake.org/files/v3.31/cmake-3.31.12-linux-x86_64.sh && chmod +x cmake-3.31.12-linux-x86_64.sh
        - mkdir -p /opt/cmake && ./cmake-3.31.12-linux-x86_64.sh --skip-license --prefix=/opt/cmake
        - ln -sf /opt/cmake/bin/cmake /usr/local/bin/cmake && ln -sf /opt/cmake/bin/ctest /usr/local/bin/ctest && ln -sf /opt/cmake/bin/cpack /usr/local/bin/cpack
prebuild:
    - find /usr/lib /usr/lib/x86_64-linux-gnu -name 'libc++fs*' 2>/dev/null
#    - /usr/bin/clang++-6.0 -v --gcc-toolchain=/usr/lib/gcc/x86_64-linux-gnu/7.5.0 -std=c++17 -x c++ -E /dev/null
dependencies_ppa:
    - ppa:ubuntu-toolchain-r/test
dependencies_host:
    - clang-8
dependencies_target:
    - libaudio-dev
    - libdrm-dev
    - libgles2-mesa-dev
    - libegl1-mesa-dev
    - libmirclient-dev
    - libmircommon-dev
    - libxkbcommon-dev
    - libdbus-1-dev
    - libudev-dev
    - libthai-dev
    - libfreetype6-dev
    - libc++-8-dev
    - libc++abi-8-dev
    - libxcursor-dev
    - libxi-dev
    - libx11-dev
    - libxrandr-dev
    - libxext-dev
    - libxfixes-dev
    - libxss-dev
    - libxtst-dev
